<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a18;
      --ink-light: #6b6b66;
      --ink-faint: #c4c4bc;
      --paper: #faf9f6;
      --paper-warm: #f3f1eb;
      --accent: #b5470a;
      --accent-light: #f5ede6;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 3rem 1.5rem 2rem;
      border-bottom: 1px solid var(--ink-faint);
      max-width: 640px;
      margin: 0 auto;
    }

    .blog-name {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .blog-tagline {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--ink-light);
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .post-list {
      list-style: none;
    }

    .post-item {
      border-bottom: 1px solid var(--ink-faint);
      padding: 2rem 0;
      cursor: pointer;
    }

    .post-item:first-child {
      padding-top: 2.5rem;
    }

    .post-item:hover .post-title {
      color: var(--accent);
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .post-date {
      font-size: 0.75rem;
      color: var(--ink-light);
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .post-tag {
      font-size: 0.7rem;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      text-transform: lowercase;
    }

    .post-title {
      font-family: 'Lora', serif;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--ink);
      transition: color 0.15s ease;
      margin-bottom: 0.5rem;
    }

    .post-excerpt {
      font-size: 0.9rem;
      color: var(--ink-light);
      line-height: 1.65;
      font-weight: 300;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-has-image {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
    }

    .post-has-image .post-content {
      flex: 1;
      min-width: 0;
    }

    .post-thumb {
      width: 72px;
      height: 72px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--paper-warm);
    }

    .loading {
      padding: 3rem 0;
      color: var(--ink-light);
      font-size: 0.9rem;
      font-weight: 300;
    }

    .error {
      padding: 2rem 0;
      color: var(--ink-light);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--ink-faint);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <header>
    <div class="blog-name">Notable</div>
    <div class="blog-tagline">Notes on learning &amp; making</div>
  </header>

  <main>
    <ul class="post-list" id="post-list">
      <li class="loading">Loading posts…</li>
    </ul>
  </main>

  <footer>Notable &mdash; built simply, kept honest</footer>

  <script>
    const INDEX_URL = 'posts/index.json';

    function formatDate(str) {
      const d = new Date(str);
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function renderPosts(posts) {
      const list = document.getElementById('post-list');
      if (!posts.length) {
        list.innerHTML = '<li class="error">No posts yet.</li>';
        return;
      }
      list.innerHTML = posts.map(post => {
        const hasImage = post.image;
        const inner = `
          <div class="post-meta">
            <span class="post-date">${formatDate(post.date)}</span>
            ${post.tag ? `<span class="post-tag">${post.tag}</span>` : ''}
          </div>
          <div class="post-title">${post.title}</div>
          <div class="post-excerpt">${post.excerpt}</div>
        `;
        return `
          <li class="post-item" onclick="location.href='post.html?id=${post.id}'">
            ${hasImage
              ? `<div class="post-has-image"><div class="post-content">${inner}</div><img class="post-thumb" src="images/${post.image}" alt="" loading="lazy"></div>`
              : inner
            }
          </li>
        `;
      }).join('');
    }

    fetch(INDEX_URL)
      .then(r => r.json())
      .then(data => renderPosts(data))
      .catch(() => {
        document.getElementById('post-list').innerHTML =
          '<li class="error">Could not load posts.</li>';
      });
  </script>
</body>
</html>
